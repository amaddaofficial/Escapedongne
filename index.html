:root{--paper:#f6f1e4;--ink:#4a4238}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#e8e2d2;

#stage{position:absolute;left:0;top:0;width:900px;height:1200px;transform-origin:0 0;will-change:transform}

/* 주사위 */

#dice{width:80px;height:80px;position:absolute;left:16px;top:16px;transform-style:preserve-3d;transition:transform .1s linear}
.face{position:absolute;width:80px;height:80px;border:3px solid #4a4238;border-radius:0;
  background:
    radial-gradient(circle at 0% 0%, rgba(50,40,28,.55), transparent 34%),
    radial-gradient(circle at 100% 0%, rgba(50,40,28,.55), transparent 34%),
    radial-gradient(circle at 0% 100%, rgba(50,40,28,.55), transparent 34%),
    radial-gradient(circle at 100% 100%, rgba(50,40,28,.55), transparent 34%),
    #d8c8a0;
  backface-visibility:hidden;overflow:hidden}
.facetop{position:absolute;inset:0;background:#fffdf4;
  clip-path:polygon(19% 0,81% 0,100% 19%,100% 81%,81% 100%,19% 100%,0 81%,0 19%);
  display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:9px;
  box-shadow:inset -7px -9px 0 rgba(74,66,56,.1), inset 0 0 0 1px rgba(74,66,56,.06)}
.pip{width:13px;height:13px;background:#4a4238;border-radius:50%;align-self:center;justify-self:center}
.pip.r{background:#c2465c}
.face.rage{background:
    radial-gradient(circle at 0% 0%, rgba(120,70,10,.55), transparent 34%),

    radial-gradient(circle at 0% 100%, rgba(120,70,10,.55), transparent 34%),
    radial-gradient(circle at 100% 100%, rgba(120,70,10,.55), transparent 34%),
    #e9b53a;
  box-shadow:0 0 14px rgba(255,200,60,.85)}
.face.rage .facetop{background:#fff3cf}
#diceHint{position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:17px;color:#6c6252;background:rgba(255,253,246,.88);padding:2px 12px;border-radius:12px;border:2px dashed #b9b0a0}

.panel h2{margin:0 0 6px;font-size:30px;font-weight:700;letter-spacing:-.5px}

.row2{display:flex;gap:10px}.row2 .btn{flex:1}

#startBtn{position:fixed;left:50%;top:52%;transform:translate(-50%,-50%);z-index:30;padding:16px 34px;font:inherit;font-size:34px;font-weight:700;background:#fffdf3;border:4px solid var(--ink);border-radius:24px;box-shadow:5px 7px 0 rgba(74,66,56,.35);cursor:pointer;animation:bob 1.9s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translate(-50%,-50%) rotate(-1.6deg)}50%{transform:translate(-50%,-56%) rotate(1.6deg)}}

#typeBubble{font-size:23px;line-height:1.5;min-height:104px;background:#fff;border:3px solid var(--ink);border-radius:16px;padding:14px;position:relative}

#toast{position:fixed;left:50%;top:calc(50% - 60px);transform:translate(-50%,-50%) scale(.7);z-index:35;background:#fffdf3;border:3.5px solid var(--ink);border-radius:18px;padding:12px 22px;font-size:26px;font-weight:700;box-shadow:4px 5px 0 rgba(74,66,56,.3);opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;text-align:center;max-width:88vw}
#toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}

#winChar{width:150px;height:150px;margin:0 auto;display:block}

</div></div>

  <div class="row2"><button class="btn ghost" id="overRetry">다시하기</button><button class="btn danger" id="overQuit">종료하기</button></div>
</div></div>

<div class="screen" id="scNoTicket"><div class="panel">
  <h2 style="text-align:center">앗! 티켓이 없다</h2>
  <p style="text-align:center">비행기표부터 챙기고<br>다시 돌아가자!</p>
  <button class="btn" id="noTicketOk">확인</button>
</div></div>

<div id="toast"></div>

<script>
/* ═══════════ 81칸 동네탈출 ═══════════ */
const W=900,H=1200,CS=100,TOP=300,N=81,LAST=80,TOPL=72;
const $=s=>document.querySelector(s);
const stage=$('#stage');
const rnd=(a,b)=>a+Math.random()*(b-a), ri=(a,b)=>Math.floor(rnd(a,b+1));
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* 좌표: row0=맨아래, row8=맨위 / ㄹ자 */
const idx=(r,c)=> r%2===0 ? r*9+c : r*9+(8-c);
const rc=i=>{const r=Math.floor(i/9),m=i%9;return{r,c:r%2===0?m:8-m};};
const cellXY=i=>{const{r,c}=rc(i);return{x:c*CS,y:TOP+(8-r)*CS};};
const ctr=i=>{const p=cellXY(i);return{x:p.x+CS/2,y:p.y+CS/2};};

/* ── 기믹 배치 (사진 판독) ─────────────────
   [시작row,시작col, 도착row,도착col]  row0=맨아래줄 */
const LAD=[
  [4,0, 7,0],   // 왼쪽 세로 긴 사다리
  [0,1, 4,2],   // 왼쪽아래 → 가운데 긴 대각 사다리
  [4,3, 6,3],
  [1,4, 3,5],
  [5,4, 8,5],   // 오른쪽 위로 뻗는 긴 사다리
  [6,2, 8,2],
  [4,6, 6,6],
  [0,6, 1,7]
];
const RED=[
  [8,1, 6,1],
  [8,4, 6,6],
  [8,6, 6,8],
  [8,7, 7,8],
  [6,3, 4,4],
  [5,7, 3,7],
  [5,8, 1,8],
  [4,5, 2,5],
  [4,1, 2,1],
  [3,6, 1,6],
  [2,8, 0,8],
  [2,3, 1,3]
];
const PUR=[[7,3,'left'],[5,5,'right'],[3,3,'up'],[3,5,'left'],[3,7,'left'],[1,7,'up'],[0,2,'right']];
const TICKETS=new Set([idx(8,5), idx(8,3)]);   // 맨윗줄, 좌측 6번째·4번째 칸 (초록칸 2개)

const ladders={},reds={},purples={};
LAD.forEach(([a,b,c,d])=>ladders[idx(a,b)]=idx(c,d));
RED.forEach(([a,b,c,d])=>reds[idx(a,b)]=idx(c,d));
PUR.forEach(([r,c,d])=>purples[idx(r,c)]=d);
[...TICKETS,0,LAST].forEach(i=>{delete ladders[i];delete reds[i];delete purples[i];});

const purTarget=(i,d)=>{const{r,c}=rc(i);
  if(d==='up')    return r<8?idx(r+1,c):i;
  if(d==='down')  return r>0?idx(r-1,c):i;
  if(d==='right') return c<8?idx(r,c+1):i;
  return c>0?idx(r,c-1):i;};

/* 신호등: 빨강(=빨강+노랑 점등) 이면 이동, 초록(=노랑+초록 점등) 이면 정지 */
let lights={};
function shuffleLights(){Object.keys(reds).forEach(k=>lights[k]=Math.random()<.5?'red':'green');paintLights();}

/* ── 캐릭터: 모서리가 둥근 삼각형 몸 + 동그란 머리 (체스 말 느낌), 이모지 얼굴 ── */
const OL='#4b423a';
/* 학생이 연필로 스케치한 느낌을 내는 공용 필터/그라디언트 정의 */
const SKETCH_DEFS=`<radialGradient id="auraGrad">
   <stop offset="0%" stop-color="#fff8cc" stop-opacity=".95"/>
   <stop offset="55%" stop-color="#ffd84a" stop-opacity=".6"/>
   <stop offset="100%" stop-color="#ffb020" stop-opacity="0"/>
 </radialGradient>`;
/* 스케치 느낌의 겹선(연필로 두 번 그은 자국) */
const sketchEcho=(d,w=1.5,o=.34)=>`<path d="${d}" fill="none" stroke="${OL}" stroke-width="${w}" opacity="${o}" transform="translate(1.8,2)"/>`
  +`<path d="${d}" fill="none" stroke="${OL}" stroke-width="${w*0.8}" opacity="${o*0.6}" transform="translate(-1.4,-1.2)"/>`;
function roundedTriangle(ax,ay,bx,by,cx,cy,r){
  const pts=[[ax,ay],[bx,by],[cx,cy]];
  const R=Array.isArray(r)?r:[r,r,r];
  const dist=(p,q)=>Math.hypot(q[0]-p[0],q[1]-p[1]);
  const lerp=(p,q,t)=>[p[0]+(q[0]-p[0])*t,p[1]+(q[1]-p[1])*t];
  let out='';
  for(let i=0;i<3;i++){
    const prev=pts[(i+2)%3], cur=pts[i], next=pts[(i+1)%3];
    const t1=Math.min(R[i]/dist(cur,prev),.5), t2=Math.min(R[i]/dist(cur,next),.5);
    const p1=lerp(cur,prev,t1), p2=lerp(cur,next,t2);
    out+=(i===0?`M${p1[0].toFixed(1)},${p1[1].toFixed(1)}`:`L${p1[0].toFixed(1)},${p1[1].toFixed(1)}`);
    out+=` Q${cur[0].toFixed(1)},${cur[1].toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
  }
  return out+' Z';
}
/* 목 부분(삼각형 꼭짓점)은 거의 각지게, 받침 두 모서리만 둥글게 → 원(머리)이 그 위를 완전히 덮어서
   삼각형 끝이 삐져나오지 않도록 함 */
const P_APEX=[0,-58], P_BL=[-32,0], P_BR=[32,0], P_RC=[3,9,9];
const BODY_PATH=roundedTriangle(P_APEX[0],P_APEX[1],P_BL[0],P_BL[1],P_BR[0],P_BR[1],P_RC);
const HEAD_CY=-84, HEAD_R=36;
const HEAD_PATH=`M${-HEAD_R},${HEAD_CY} a${HEAD_R},${HEAD_R} 0 1,0 ${HEAD_R*2},0 a${HEAD_R},${HEAD_R} 0 1,0 ${-HEAD_R*2},0`;
function pawnBody(color){
  return `<path d="${BODY_PATH}" fill="${color}" stroke="${OL}" stroke-width="2.6" stroke-linejoin="round"/>
    ${sketchEcho(BODY_PATH,1.4,.2)}`;
}
function pawnHead(color){
  return `<circle cx="0" cy="${HEAD_CY}" r="${HEAD_R}" fill="${color}" stroke="${OL}" stroke-width="2.8"/>
    ${sketchEcho(HEAD_PATH,1.4,.2)}`;
}
/* 로봇 전용: 끝이 둥근 사각형 머리 */
function pawnSquareHead(color){
  const w=HEAD_R*1.86, rx=HEAD_R*0.42, y=HEAD_CY-w/2;
  return `<rect x="${(-w/2).toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${w.toFixed(1)}" rx="${rx.toFixed(1)}" fill="${color}" stroke="${OL}" stroke-width="2.8"/>
    <rect x="${(-w/2+1.8).toFixed(1)}" y="${(y+2).toFixed(1)}" width="${w.toFixed(1)}" height="${w.toFixed(1)}" rx="${rx.toFixed(1)}" fill="none" stroke="${OL}" stroke-width="1.2" opacity=".2"/>`;
}
/* 단순한 이모지st 헤어 4종 (있음/없음 + 좌우 앞머리 + 위쪽 묶음) */
function pawnHair(style,color){
  return (cy,r)=>{
    switch(style){
      case 'tuft': // 사진 1번: 정수리에 삐죽 튀어나온 잔머리 두 가닥
        return `<path d="M${(-r*.12).toFixed(1)},${(cy-r*1.02).toFixed(1)} q${(-r*.2).toFixed(1)},${(-r*.3).toFixed(1)} ${(-r*.03).toFixed(1)},${(-r*.42).toFixed(1)}" stroke="${color}" stroke-width="5" fill="none" stroke-linecap="round"/>
          <path d="M${(r*.14).toFixed(1)},${(cy-r*1.02).toFixed(1)} q${(r*.22).toFixed(1)},${(-r*.28).toFixed(1)} ${(r*.05).toFixed(1)},${(-r*.4).toFixed(1)}" stroke="${color}" stroke-width="5" fill="none" stroke-linecap="round"/>`;
      case 'cap': { // 사진 2번: 캡모자 — 머리 꼭대기 쪽으로 확실히 올림
        const bw=r*.9, hemY=cy-r*.62, sideY=cy-r*.77, domeY=cy-r*1.15;
        return `<path d="M${(-bw).toFixed(1)},${sideY.toFixed(1)} Q0,${domeY.toFixed(1)} ${bw.toFixed(1)},${sideY.toFixed(1)} L${bw.toFixed(1)},${hemY.toFixed(1)} Q0,${(hemY+r*.06).toFixed(1)} ${(-bw).toFixed(1)},${hemY.toFixed(1)} Z" fill="${color}" stroke="${OL}" stroke-width="2.4" stroke-linejoin="round"/>
          <ellipse cx="${(-r*.8).toFixed(1)}" cy="${(hemY-r*.02).toFixed(1)}" rx="${(r*.4).toFixed(1)}" ry="${(r*.14).toFixed(1)}" fill="${color}" stroke="${OL}" stroke-width="2" transform="rotate(-10 ${(-r*.8).toFixed(1)} ${(hemY-r*.02).toFixed(1)})"/>`;
      }
      case 'crown': // 사진 3번: 지그재그 왕관

/* 얼굴: 이모지처럼 아주 단순하게 — 점 눈 + 입 하나 */
function face(m){
  const e='#3b332b';
  const dot=(x,r=4.6)=>`<circle cx="${x}" cy="0" r="${r}" fill="${e}"/>`;
  const flat=(x)=>`<line x1="${x-5.5}" y1="0" x2="${x+5.5}" y2="0" stroke="${e}" stroke-width="3" stroke-linecap="round"/>`;
  switch(m){
    case 'happy':
    case 'bright':
      return dot(-13)+dot(13)+`<path d="M-9,9 q9,9 18,0" stroke="${e}" stroke-width="3" fill="none" stroke-linecap="round"/>`;
    case 'tired':
      return flat(-13)+flat(13)+`<path d="M-6,11 q6,3 12,0" stroke="${e}" stroke-width="2.6" fill="none" stroke-linecap="round"/>`;
    case 'sad':
      return dot(-13)+dot(13)+`<path d="M-9,14 q9,-8 18,0" stroke="${e}" stroke-width="3" fill="none" stroke-linecap="round"/>`;
    case 'tongue':
      return flat(-13)+dot(13)+`<path d="M-8,9 q8,8 16,0" stroke="${e}" stroke-width="3" fill="none" stroke-linecap="round"/><ellipse cx="0" cy="13" rx="4" ry="5" fill="#e8798d"/>`;
    case 'shock':
      return `<circle cx="-13" cy="0" r="7" fill="#fff" stroke="${e}" stroke-width="2.2"/><circle cx="-13" cy="0" r="3" fill="${e}"/>`+
             `<circle cx="13" cy="0" r="7" fill="#fff" stroke="${e}" stroke-width="2.2"/><circle cx="13" cy="0" r="3" fill="${e}"/>`+
             `<ellipse cx="0" cy="14" rx="4" ry="5" fill="${e}"/>`;
    case 'plain':
    default:
      return dot(-13)+dot(13)+`<path d="M-7,11 q7,4 14,0" stroke="${e}" stroke-width="2.6" fill="none" stroke-linecap="round"/>`;
  }
}

function arrowPath(x1,y1,x2,y2,col,wd,hl){

  const ax=x2-Math.cos(ang)*hl*0.72, ay=y2-Math.sin(ang)*hl*0.72;
  const p1x=x2-Math.cos(ang-.44)*hl, p1y=y2-Math.sin(ang-.44)*hl;

  return `<path d="M${x1},${y1} L${ax},${ay}" stroke="${col}" stroke-width="${wd}" stroke-linecap="round" opacity=".95"/>

function gimmickArt(){
  let s='<g filter="url(#crayon)">';

    const dx=B.x-A.x,dy=B.y-A.y,L=Math.hypot(dx,dy);
    const nx=-dy/L*12, ny=dx/L*12;
    s+=`<path d="M${A.x+nx},${A.y+ny} L${B.x+nx},${B.y+ny}" stroke="#5aa9dd" stroke-width="10" stroke-linecap="round" opacity=".93"/>`;

    const rg=Math.max(3,Math.round(L/44));
    for(let k=1;k<rg;k++){const t=k/rg,px=A.x+dx*t,py=A.y+dy*t;
      s+=`<path d="M${px+nx},${py+ny} L${px-nx},${py-ny}" stroke="#7fc0e8" stroke-width="7" stroke-linecap="round" opacity=".9"/>`;}
  }
  for(const a in reds){const A=ctr(+a),B=ctr(reds[a]);s+=arrowPath(A.x,A.y,B.x,B.y,'#c2465c',12,30);}
  for(const a in purples){

function animate(dur,fn){return new Promise(res=>{
  if(dur<=0){fn(1);return res();}
  const t0=performance.now();
  (function step(t){const k=Math.min(1,(t-t0)/dur);fn(k);k<1?requestAnimationFrame(step):res();})(performance.now());});}

    cam.fx=a.fx+(fx-a.fx)*e;cam.fy=a.fy+(fy-a.fy)*e;cam.z=a.z+(z-a.z)*e;applyCam();});}

let AC=null;
const audioOn=()=>{if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();};
function beep(f,d,type='sine',vol=.16){if(!AC)return;const o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.value=f;o.connect(g);g.connect(AC.destination);const t=AC.currentTime;
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.start(t);o.stop(t+d+.02);}
function noise(d=.35,vol=.22,freq=1400,q=1){if(!AC)return;const n=AC.sampleRate*d,b=AC.createBuffer(1,n,AC.sampleRate),ch=b.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*Math.pow(1-i/n,2.2);
  const s=AC.createBufferSource();s.buffer=b;const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=freq;f.Q.value=q;
  const g=AC.createGain();g.gain.value=vol;s.connect(f);f.connect(g);g.connect(AC.destination);s.start();}
function thump(f0,f1,d,vol=.22,type='sine'){if(!AC)return;const o=AC.createOscillator(),g=AC.createGain();
  const t=AC.currentTime;o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t+d);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02);}

  if(p.pos>0&&momCells().includes(p.pos)){
    setMood(p,'shock');mom.mood='angry';paintMom();SFX.caught();buzz([70,50,70,50,120]);
    await zoomCell(p.pos,2.1);
    await toast(`😡 엄마한테 딱 걸렸다!<br>${p.name} 학원으로 복귀`,1500);
    p.dir=1;await slideTo(p,0,900);setMood(p,'sad');return true;
  }
  return false;
}

/* ── 턴 ─────────────────────────────────── */
function triggerRoll(power=0){
  if(!canRoll||busy||lock)return;
  lock=true;canRoll=false;$('#diceWrap').classList.add('disabled');
  takeTurn(power)
    .catch(err=>{console.error('턴 진행 중 오류, 복구합니다:',err);if(playing)beginTurn();})
    .finally(()=>{lock=false;});
}
async function takeTurn(power=0){
  busy=true;
  try{
    const p=players[cur];
    const n=await rollDiceAnim('normal',power);
    if(!playing)return;
    await toast(`${p.name} — ${n}칸!`,800);
    await walk(p,n);
    buzz([16,10,34]);
    await zoomCell(p.pos);await wait(180);
    await resolveCell(p);
    await checkCatch(p,n);
    const caught=await checkMom(p);
    if(!caught&&p.pos===LAST){
      if(p.ticket){await finish(p);return;}
      setMood(p,'sad');refresh(p);
      await showNoTicketPopup();
    }
    await fullView(460);
    cur++;
    if(cur>=players.length){cur=0;await momTurn();}else beginTurn();
  } finally {
    busy=false;
  }
}
async function momTurn(){
  busy=true;
  try{
    if(round===1){ round++; beginTurn(); return; }  // 1번째 턴엔 엄마 등장 안 함, 2번째 턴부터 등장
    setTurnLabel('엄마');
    if(!momActive){
      momActive=true; mom.pos=0; mom.mood='calm'; paintMom();
      audioOn(); SFX.momAppear(); buzz([0,55,70,55,200]);
      await zoomCell(mom.pos,1.85);
      await toast('두둥! 엄마 등장!! 조심해!',1300);
      await wait(150);
    }
    mom.mood=['angry','phone','sweat','calm'][ri(0,3)];paintMom();
    await toast('엄마 차례!',600);
    const step=await rollDiceAnim(momRage?'momRage':'mom');
    if(!playing)return;
    for(let k=0;k<step;k++){
      if(mom.pos>=LAST)break;
      await momHop(mom.pos+1);
      await wait(RM?0:55);
      if(mom.pos>=LAST)break;
    }
    await zoomCell(mom.pos,1.7);
    for(const p of players) await checkMom(p);
    if(!playing)return;
    if(mom.pos>=LAST){ await momGameOver(); return; }
    await fullView(460);
    round++;beginTurn();
  } finally {
    busy=false;
  }
}
async function momGameOver(){
  playing=false;canRoll=false;
  mom.mood='angry';paintMom();
  SFX.gameover();buzz([90,60,90,60,90,220]);
  await toast('😱 엄마가 먼저 공항에 도착했다!!',1500);
  await wait(500);
  SFX.popup();
  $('#scOver').classList.add('on');
}
function beginTurn(){
  if(winner||!playing)return;
  shuffleLights();
  const p=players[cur];
  setTurnLabel(p.robot?'로봇':`${cur+1}P`);
  setMood(p,'nervous');
  if(p.auto){setTimeout(()=>{canRoll=true;triggerRoll();},800);}
  else{canRoll=true;$('#diceWrap').classList.remove('disabled');}
}

/* ── 골인 ───────────────────────────────── */
async function finish(p){
  winner=p;canRoll=false;
  setMood(p,'bright');
  await zoomCell(LAST,1.9);
  await toast('비행기표 확인! 공항으로!',1000);
  let a=tokenXY(p);
  for(let k=0;k<3;k++){
    const s=STEP_XY[k];SFX.hop();buzz(12);
    await animate(RM?0:340,t=>drawToken(p,a.x+(s.x-a.x)*t,a.y+(s.y-a.y)*t-Math.sin(Math.PI*t)*50,1));
    drawToken(p,s.x,s.y,1);a={x:s.x,y:s.y};
    await setCam(s.x,Math.max(200,s.y-40),1.7,300);
    await toast(['체크인 완료','게이트 통과','비행기표!'][k],700);
  }
  SFX.ticket();
  await setCam(W/2,250,1.15,600);
  await toast('탑승 완료! 엄마, 안녕~',1000);
  const plane=$('#planeG'),arm=document.getElementById('waveArm');
  const wv=setInterval(()=>{arm.setAttribute('transform',arm.getAttribute('transform')==='rotate(-32 13 -7)'?'rotate(12 13 -7)':'rotate(-32 13 -7)');},180);
  SFX.win();buzz([30,60,30,60,30,60,120]);
  drawToken(p,205,208,.62);
  await animate(RM?0:2400,k=>{
    const e=k*k,x=-e*790,y=-e*240;
    plane.setAttribute('transform',`translate(${175+x},${192+y}) rotate(${-e*14}) scale(${1-e*.45})`);
    plane.style.opacity=String(1-Math.max(0,(k-.6)/.4));
    drawToken(p,205+x,208+y,.62*(1-e*.45));
    p.el.style.opacity=String(1-Math.max(0,(k-.6)/.4));
  });
  clearInterval(wv);await wait(200);showWin(p);
}

/* ── 화면 흐름 ──────────────────────────── */
const MSG='으 학원에서 탈출했지만 엄마한테 혼날게 뻔해, 동네를 탈출하자!';
$('#startBtn').addEventListener('click',async()=>{
  audioOn();$('#startBtn').style.display='none';$('#scIntro').classList.add('on');
  const t=$('#typeText');t.textContent='';$('#introNext').disabled=true;
  for(let i=0;i<MSG.length;i++){t.textContent+=MSG[i];if(i%2===0)beep(600+ri(-60,60),.03,'square',.05);await wait(RM?0:42);}
  $('#introNext').disabled=false;
});
let cnt=0,picks=[],pi=0;
$('#introNext').addEventListener('click',()=>{$('#scIntro').classList.remove('on');openSetup();});
function openSetup(){
  cnt=0;picks=[];pi=0;
  $('#numRow').innerHTML=[1,2,3,4].map(n=>`<button class="numbtn" data-n="${n}">${n} Player</button>`).join('');
  $('#charStep').style.display='none';$('#setupGo').disabled=true;
  $('#scSetup').classList.add('on');
  $('#numRow').querySelectorAll('.numbtn').forEach(b=>b.addEventListener('click',()=>{
    document.querySelectorAll('.numbtn').forEach(x=>x.classList.remove('sel'));
    b.classList.add('sel');cnt=+b.dataset.n;picks=[];pi=0;
    $('#charStep').style.display='block';grid();beep(700,.07,'triangle',.12);}));
}
function grid(){
  if(pi>=cnt){$('#charAsk').textContent='다 골랐어! 확인을 눌러줘.';$('#setupGo').disabled=false;}
  else{$('#charAsk').textContent=`${pi+1} Player, 캐릭터를 골라줘`;$('#setupGo').disabled=true;}
  $('#charGrid').innerHTML=CHARS.map((c,i)=>
    `<button class="charcard${picks.includes(i)?' taken':''}" data-c="${i}">
      <svg viewBox="-50 -145 100 160">${charSVG(c,'plain',null,false,pi<cnt?pi+1:'')}</svg></button>`).join('');
  $('#charGrid').querySelectorAll('.charcard').forEach(b=>b.addEventListener('click',()=>{
    if(pi>=cnt)return;picks.push(+b.dataset.c);pi++;beep(880,.08,'triangle',.13);buzz(12);grid();}));
  $('#pickedRow').innerHTML=picks.map((id,i)=>`<span class="pchip" style="border-color:${PCOLOR[i]}">${i+1} Player</span>`).join('')
    +(cnt===1&&picks.length===1?`<span class="pchip" style="border-color:${PCOLOR[1]}">로봇친구</span>`:'');
}
$('#setupGo').addEventListener('click',()=>{$('#scSetup').classList.remove('on');startGame();});

async function startGame(){
  players=[];cur=0;round=1;winner=null;playing=true;momActive=false;momRage=false;momScale=MOM_SCALE;
  picks.forEach((id,i)=>players.push({name:`${i+1} Player`,def:CHARS[id],color:PCOLOR[i],num:i+1,
    pos:0,dir:1,ticket:false,mood:'nervous',auto:false,robot:false}));
  if(cnt<=1) players.push({name:'로봇친구',def:CHARS[0],color:PCOLOR[1],rvar:ri(0,1),
    pos:0,dir:1,ticket:false,mood:'nervous',auto:true,robot:true});
  mom={def:MOMS[ri(0,2)],pos:0,mood:'calm'};
  const g=$('#gTokens');g.innerHTML='';
  players.forEach(p=>{const el=document.createElementNS('http://www.w3.org/2000/svg','g');
    el.innerHTML=tokenMarkup(p);g.appendChild(el);p.el=el;});
  placeAll();  // 엄마는 2번째 턴부터 등장하므로 아직 그리지 않음
  $('#dicebar').style.display='flex';
  setTurnLabel('1P');
  await setCam(ctr(0).x+130,ctr(0).y-70,2.0,700);
  await toast('학원 — 여기서 출발!',1300);
  await wait(300);await fullView(760);
  shuffleLights();beginTurn();
}

/* 종료 / 재도전 */
$('#quitNo').addEventListener('click',()=>{SFX.click();$('#scQuit').classList.remove('on');});
$('#quitYes').addEventListener('click',()=>{SFX.click();$('#scQuit').classList.remove('on');resetAll();});

function showWin(p){
  $('#winChar').innerHTML=`<svg viewBox="-55 -145 110 160">${tokenMarkup({...p,mood:'bright',ticket:false})}</svg>`;
  $('#winSub').textContent=`${p.name} — 동네 탈출 성공!`;
  SFX.popup();
  $('#scWin').classList.add('on');confetti();
}
$('#winOk').addEventListener('click',()=>{SFX.click();$('#scWin').classList.remove('on');resetAll();});
$('#overRetry').addEventListener('click',()=>{SFX.click();$('#scOver').classList.remove('on');retryGame();});
$('#overQuit').addEventListener('click',()=>{SFX.click();$('#scOver').classList.remove('on');resetAll();});

function showNoTicketPopup(){
  SFX.popup();buzz([30,50,30]);
  $('#scNoTicket').classList.add('on');
  return new Promise(res=>{
    const btn=$('#noTicketOk');
    const onClick=()=>{SFX.click();btn.removeEventListener('click',onClick);$('#scNoTicket').classList.remove('on');res();};
    btn.addEventListener('click',onClick);
  });
}
function retryGame(){
  players.forEach(p=>{if(p.el)p.el.remove();});
  players=[];
  buildStage();shuffleLights();
  $('#dicebar').style.display='none';
  startGame();
}
function resetAll(){
  playing=false;canRoll=false;busy=false;winner=null;round=1;cur=0;momActive=false;momRage=false;momScale=MOM_SCALE;
  players.forEach(p=>{if(p.el){p.el.style.opacity='1';p.el.remove();}});
  players=[];
  buildStage();shuffleLights();
  $('#dicebar').style.display='none';$('#startBtn').style.display='block';
  fullView(0);
}
function confetti(){
  const c=document.createElement('canvas');c.className='confetti';
  c.width=innerWidth;c.height=innerHeight;document.body.appendChild(c);
  const x=c.getContext('2d'),cols=['#f2c94c','#5aa9dd','#c2465c','#7fc47f','#6b4fa0'];
  const ps=Array.from({length:90},()=>({x:rnd(0,c.width),y:rnd(-c.height,0),w:rnd(6,13),h:rnd(9,18),
    v:rnd(1.6,4.4),a:rnd(0,6.3),s:rnd(-.12,.12),col:cols[ri(0,4)]}));
  let f=0;(function loop(){x.clearRect(0,0,c.width,c.height);
    ps.forEach(p=>{p.y+=p.v;p.a+=p.s;if(p.y>c.height)p.y=-20;
      x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.col;x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore();});
    if(++f<330)requestAnimationFrame(loop);else c.remove();})();
}

fullView(0);showDice(1,0,0,0);
</script>
